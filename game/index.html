<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SOLIS CITY: CORAL COAST</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #fff;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      outline: none;
    }

    /* Cyberpunk HUD Layer */
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Radar Minimap */
    #minimap-container {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }

    #minimap-canvas {
      width: 180px;
      height: 180px;
      border-radius: 50%;
    }

    /* Speedometer */
    #speedometer {
      position: absolute;
      bottom: 25px;
      right: 35px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: rgba(10, 15, 28, 0.75);
      border-left: 3px solid #00f0ff;
      padding: 10px 18px;
      border-radius: 4px;
      backdrop-filter: blur(8px);
    }

    #speed-value {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    }

    #gear-value {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffaa00;
    }

    /* Wanted Stars */
    #wanted-stars {
      position: absolute;
      top: 25px;
      right: 35px;
      display: flex;
      gap: 6px;
    }

    .star {
      width: 26px;
      height: 26px;
      background: rgba(255, 255, 255, 0.15);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      transition: all 0.2s ease;
    }

    .star.active {
      background: #ffcc00;
      box-shadow: 0 0 12px #ffcc00;
    }

    .star.active.strobe {
      background: #ff0044;
      box-shadow: 0 0 16px #ff0044;
    }

    /* Weapon & Ammo HUD */
    #weapon-hud {
      position: absolute;
      top: 65px;
      right: 35px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: rgba(10, 15, 28, 0.7);
      padding: 8px 14px;
      border-right: 3px solid #ff007f;
      border-radius: 4px;
    }

    #weapon-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ff007f;
    }

    #weapon-ammo {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    /* Player Vitals */
    #vitals-container {
      position: absolute;
      bottom: 215px;
      left: 25px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 180px;
    }

    .bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    #health-bar {
      width: 100%;
      height: 100%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
      transition: width 0.2s;
    }

    #armor-bar {
      width: 100%;
      height: 100%;
      background: #00d0ff;
      box-shadow: 0 0 8px #00d0ff;
      transition: width 0.2s;
    }

    /* Mission Objectives */
    #mission-card {
      position: absolute;
      top: 25px;
      left: 25px;
      background: rgba(10, 15, 28, 0.85);
      border-left: 4px solid #ffaa00;
      padding: 12px 18px;
      border-radius: 4px;
      max-width: 320px;
      backdrop-filter: blur(8px);
    }

    #obj-title {
      font-size: 14px;
      font-weight: 800;
      color: #ffaa00;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #obj-desc {
      font-size: 13px;
      color: #d8e0ea;
      margin-top: 4px;
      line-height: 1.4;
    }

    #obj-dist {
      font-size: 11px;
      color: #00f0ff;
      font-weight: 600;
      margin-top: 6px;
    }

    /* Toast Notification */
    #hud-toast {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translate(-50%, -10px);
      background: rgba(15, 20, 35, 0.95);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      font-weight: 700;
      letter-spacing: 1.5px;
      font-size: 15px;
      padding: 12px 28px;
      border-radius: 30px;
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
    }

    /* Center Crosshair */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
    }

    /* Hitmarker */
    #hitmarker {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.05s ease;
    }
    #hitmarker::before, #hitmarker::after {
      content: '';
      position: absolute;
      background: #ff0033;
    }
    #hitmarker::before {
      top: 0; left: 11px; width: 2px; height: 24px; transform: rotate(45deg);
    }
    #hitmarker::after {
      top: 0; left: 11px; width: 2px; height: 24px; transform: rotate(-45deg);
    }

    /* Title Presentation Banner */
    #title-card {
      display: none;
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      background: rgba(8, 12, 22, 0.8);
      padding: 20px 48px;
      border-top: 2px solid #00f0ff;
      border-bottom: 2px solid #ff007f;
      border-radius: 8px;
      backdrop-filter: blur(12px);
    }

    #title-card h1 {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 8px;
      background: linear-gradient(135deg, #00f0ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
    }

    #title-card h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 6px;
      color: #ffaa00;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <div id="hud-overlay">
    <div id="mission-card">
      <div id="obj-title">MISSION</div>
      <div id="obj-desc">Explore Solis City</div>
      <div id="obj-dist">0m to target</div>
    </div>

    <div id="vitals-container">
      <div class="bar-bg"><div id="health-bar"></div></div>
      <div class="bar-bg"><div id="armor-bar"></div></div>
    </div>

    <div id="minimap-container">
      <canvas id="minimap-canvas" width="180" height="180"></canvas>
    </div>

    <div id="speedometer">
      <div id="speed-value">0 MPH</div>
      <div id="gear-value">GEAR N</div>
    </div>

    <div id="wanted-stars">
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
    </div>

    <div id="weapon-hud">
      <div id="weapon-name">CAR-80 CARBINE</div>
      <div id="weapon-ammo">30 / 180</div>
    </div>

    <div id="crosshair"></div>
    <div id="hitmarker"></div>
    <div id="hud-toast"></div>

    <div id="title-card">
      <h1>SOLIS CITY</h1>
      <h2>CORAL COAST</h2>
    </div>
  </div>

  <!-- Runtime Libraries -->
  <script src="vendor/three.min.js"></script>
  <!-- Application Bootstrap -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
